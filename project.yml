# XcodeGen manifest. SwiftPM cannot build an iOS .app, so the app target lives
# here and consumes the feature modules from Package.swift as a local package.
#
#   brew install xcodegen && xcodegen generate && open ApartmentListMap.xcodeproj
name: ApartmentListMap
options:
  bundleIdPrefix: com.apartmentlist.prototype
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Features:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  ApartmentListMap:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
    # Deliberately no `info:` block: that key makes XcodeGen generate a plist
    # and overwrite App/Info.plist, which silently dropped UILaunchScreen (the
    # app then letterboxes in compatibility mode) and both demo flags.
    dependencies:
      - package: Features
        product: ALAppFeature
      - package: Features
        product: ALCore
      - package: Features
        product: ALAuth
      - package: Features
        product: ALLocation
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.apartmentlist.prototype.map
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - ApartmentListMapUITests

  # QA target. simctl cannot drive taps, so every flow that needs a gesture
  # (card detents, the wall, the detail screen, the permission sheets) is
  # exercised here. Also the only way to assert on what VoiceOver would read.
  ApartmentListMapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: ApartmentListMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apartmentlist.prototype.map.uitests
        TARGETED_DEVICE_FAMILY: "1"
        # The app target deliberately has no `info:` block (it would clobber
        # App/Info.plist). The test bundle has no plist of its own to protect,
        # so it can just have one generated.
        GENERATE_INFOPLIST_FILE: YES
